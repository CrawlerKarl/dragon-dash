<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dragon Dash — A DBZ Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    position:fixed;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  canvas {
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
  }
  #rotate {
    display:none;
    position:absolute; inset:0;
    background:#06060f;
    color:#ffd24a;
    z-index:50;
    text-align:center;
    font-family:monospace;
    padding-top:30vh;
    font-size:18px;
    line-height:1.8;
  }
  @media (orientation: portrait) and (max-width: 600px) {
    #rotate { display:block; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="rotate">&#128241; &#8635;<br>Rotate your phone sideways<br>for the best experience!<br><br><span style="color:#9ad1ff;font-size:13px">(or keep playing in portrait, it works too)</span></div>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/bosses.js"></script>
<script src="js/game.js"></script>
</body>
</html>
