<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dragon Dash — A DBZ Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    position:fixed;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  canvas { display:block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<script src="js/audio.js?v=4"></script>
<script src="js/sprites.js?v=4"></script>
<script src="js/levels.js?v=4"></script>
<script src="js/entities.js?v=4"></script>
<script src="js/bosses.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
